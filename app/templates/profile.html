<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - STOCKOLON 26</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body>

    <!-- 헤더 -->
    <header>
        <a href="{{ url_for('main.index') }}" class="logo-link" aria-label="메인으로 이동">
            <img src="{{ url_for('static', filename='images/stockolon_logo.png') }}" id="logo" alt="STOCKOLON 26 Logo" />
        </a>

        <nav id="header-nav">
            <!-- 유저 정보 -->
            <div class="user-info">
                <div class="user-avatar">
                    <img src="{{ url_for('static', filename='images/default_stock_logo.png') }}" alt="기본 프로필 이미지">
                </div>
                <span class="head2 user-name">회원</span>
                <span class="user-rank">순위 준비 중</span>
            </div>
            <!-- 버튼 -->
            <a id="ranking_btn" href="{{ url_for('main.rank') }}">
                <img src="{{ url_for('static', filename='images/ranking_icon.png') }}" alt="랭킹">
            </a>
            <button id="logout_btn">로그아웃</button>
        </nav>
    </header>

    <main>

        <!-- 자산 요약 섹션 -->
        <section id="summary">

            <!-- 총 자산 -->
            <article class="summary-card" id="card-total-assets">
                <div class="summary-label head3">총 자산</div>
                <div class="summary-value head1">—</div>
                <div class="summary-sub">
                    <span class="summary-label head3">평가손익</span>
                    <div class="summary-change negative head1">—</div>
                    <div class="summary-change-pct negative head3">—</div>
                </div>
            </article>

            <!-- 매입금액 & 보유 현금 -->
            <article class="summary-card" id="card-purchase">
                <div class="summary-label head3">총 매입금액</div>
                <div class="summary-value head1">—</div>
                <div class="summary-sub">
                    <span class="summary-label head3">보유 현금</span>
                    <div class="summary-value head1">—</div>
                </div>
            </article>

            <!-- 5분 TOP 등락 -->
            <article class="summary-card" id="card-top">
                <div class="top-row">
                    <span class="summary-label head3">5분 상승 TOP</span>
                    <div class="top-stock">
                        <span class="top-stock-name head2">데이터 없음</span>
                        <span class="top-stock-info head3">—</span>
                        <span class="top-stock-pct positive head1">—</span>
                        <span class="arrow-up">&#8599;</span>
                    </div>
                </div>
                <hr class="divider" />
                <div class="top-row">
                    <span class="summary-label head3">5분 하락 TOP</span>
                    <div class="top-stock">
                        <span class="top-stock-name head2">데이터 없음</span>
                        <span class="top-stock-info head3">—</span>
                        <span class="top-stock-pct negative head1">—</span>
                        <span class="arrow-down">&#8600;</span>
                    </div>
                </div>
            </article>

        </section>


        <!-- 보유 주식 섹션 -->
        <section id="holdings">
            <span class="head1 section-title">보유 주식</span>

            <table id="holdings-table">
                <thead>
                    <tr>
                        <th class="head3">종목명</th>
                        <th class="head3">보유 수량</th>
                        <th class="head3">현재가</th>
                        <th class="head3">평가손익</th>
                        <th class="head3">수익률</th>
                        <th class="head3">차트(30분간)</th>
                    </tr>
                </thead>
                <tbody><tr><td colspan="6">보유 주식을 불러오는 중입니다.</td></tr></tbody>
            </table>

        </section>

        <section id="trade-history" class="summary-card" aria-labelledby="history-title">
            <h2 id="history-title" class="head1 section-title">최근 거래 내역</h2>
            <div id="trade-history-list" aria-live="polite">거래 내역을 불러오는 중입니다.</div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/header-profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>

</body>
</html>
