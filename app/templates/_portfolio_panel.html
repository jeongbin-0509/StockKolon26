<section class="portfolio-panel" data-portfolio-mode="{{ portfolio_mode }}" aria-label="{{ '내 투자 현황' if portfolio_mode == 'own' else '투자 현황' }}">
    {% if portfolio_mode == 'own' %}
    <div class="pf-heading">
        <h1>내 투자 현황</h1>
        <button type="button" class="pf-refresh" aria-label="투자 현황 새로고침">↻</button>
    </div>
    {% endif %}
    <p class="pf-status" role="status">투자 현황을 불러오는 중입니다.</p>
    <div class="pf-content" hidden>
        <section class="pf-hero" aria-label="자산 요약"><div class="pf-hero-top"><span>총자산</span>{% if portfolio_mode != "own" %}<span class="pf-rank"></span>{% endif %}</div><strong class="pf-total">—</strong><div class="pf-profit-line"><span>현재 손익</span><strong class="pf-profit">—</strong><span class="pf-rate"></span></div><div class="pf-metrics"><div><span>남은 현금</span><strong class="pf-cash">—</strong></div><div><span>보유 주식 가치</span><strong class="pf-stock-value">—</strong></div></div></section>
        <section class="pf-allocation pf-card" aria-label="자산 비중"><div class="pf-section-title"><h2>자산 비중</h2><span class="pf-count"></span></div><div class="pf-allocation-body"><div class="pf-donut" role="img" aria-label="자산 비중"><div><span>주식 비중</span><strong class="pf-stock-ratio">—</strong></div></div><ul class="pf-legend"></ul></div></section>
        <section class="pf-holdings" aria-label="보유 주식"><div class="pf-section-title"><h2>보유 주식</h2>{% if portfolio_mode == 'own' %}<a href="{{ url_for('main.buy') }}">종목 둘러보기 →</a>{% endif %}</div><div class="pf-holding-list"></div></section>
        {% if portfolio_mode == 'own' %}<a class="pf-history-link" href="{{ url_for('main.profile') }}">최근 거래 내역 확인 <span>→</span></a>{% endif %}
    </div>
</section>
