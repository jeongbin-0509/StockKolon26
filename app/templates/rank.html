<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랭킹 - STOCKOLON 26</title>
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rank.css', v=2) }}">
</head>
<body>
<header class="buy-header">
    <a href="{{ url_for('main.index') }}" class="logo-link"><img src="{{ url_for('static', filename='images/stockolon_logo.png') }}" id="logo" alt="STOCKOLON 26"></a>
    <nav id="header-nav">
        <a href="{{ url_for('main.profile') }}" class="user-pill"><span class="user-avatar"><img src="{{ url_for('static', filename='images/default_stock_logo.png') }}" alt="프로필 이미지"></span><span class="user-name">내 프로필</span></a>
        <a href="{{ url_for('main.rank') }}" class="nav-icon active" aria-label="랭킹"><img src="{{ url_for('static', filename='images/ranking_icon.png') }}" alt=""></a>
    </nav>
</header>
<nav class="page-back-nav" aria-label="페이지 이동"><a class="page-back-link" href="{{ url_for('main.index') }}">← 메인으로</a></nav>
<main class="rank-page">
    <div class="rank-heading"><div><h1>랭킹</h1><p>총자산을 기준으로 순위가 정해져요.</p></div><button id="refresh" class="refresh-btn" type="button">↻ 새로고침</button></div>
    <nav class="rank-filters" aria-label="랭킹 범위">
        <button type="button" class="active" data-scope="school" aria-pressed="true">전교</button>
        <button type="button" data-scope="class" aria-pressed="false">내 학급</button>
        <button type="button" data-scope="club" aria-pressed="false">내 동아리</button>
    </nav>
    <p class="rank-description">총자산 = 보유 현금 + 보유 주식의 현재 매도 평가액 · 같은 자산은 공동 순위</p>
    <div id="status" class="rank-status" role="status" aria-live="polite">랭킹을 불러오는 중입니다.</div>
    <section id="ranking-content" hidden>
        <h2>내 순위</h2><div id="my-rank"></div>
        <div class="list-heading"><h2 id="list-title">전교 랭킹</h2><span id="member-count"></span></div>
        <div id="podium" class="podium"></div>
        <div id="rank-list" class="rank-list"></div>
        <p class="rank-footnote">상위 100명까지 표시합니다. 보유 주식 수익률은 매입금액 대비 현재 매도 평가액 기준입니다.</p>
    </section>
</main>
<script src="{{ url_for('static', filename='js/header-profile.js') }}" data-autoload="true"></script>
<script src="{{ url_for('static', filename='js/rank.js') }}"></script>
{% include '_pwa_script.html' %}
</body>
</html>
