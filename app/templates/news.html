<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - STOCKOLON 26</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/news.css') }}">
</head>
<body>

    <!-- 헤더 -->
    <header class="news-header">
        <a href="{{ url_for('main.index') }}" class="logo-link" aria-label="메인으로 이동">
            <img src="{{ url_for('static', filename='images/stockolon_logo.png') }}" id="logo" alt="STOCKOLON 26 Logo" />
        </a>

        <nav id="header-nav">
            <!-- 유저 정보 -->
            <div class="user-info">
                <div class="user-avatar">
                    <span class="avatar-default-icon">&#9679;</span>
                </div>
                <span class="head2 user-name">세미님</span>
                <span class="user-rank">전체 1위</span>
            </div>
            <!-- 버튼 -->
            <a id="ranking_btn" href="{{ url_for('main.rank') }}">
                <img src="{{ url_for('static', filename='images/ranking_icon.png') }}" alt="랭킹">
            </a>
            <button id="logout_btn">로그아웃</button>
        </nav>
    </header>
    
    <main class="news-page">
        <p class="news-kicker">SEMI NEWS</p>
        <h1>동아리 시장 뉴스</h1>
        <p class="news-description">새로운 소식과 동아리 시장의 흐름을 확인하세요.</p>
        {% for article in articles %}
        <article class="news-card">
            <div class="news-meta"><span class="news-tag {{ 'up' if article.impact > 0 else 'down' }}">{{ article.sentiment }}</span><span>{{ article.target_name }}</span><time>{{ article.published_at|kst_time }}</time></div>
            <h2>{{ article.title }}</h2>
            <p class="news-body">{{ article.body }}</p>
        </article>
        {% else %}<section class="news-empty"><h2>아직 새로운 소식이 없어요</h2><p>뉴스가 발행되면 이곳에서 확인할 수 있어요.</p></section>{% endfor %}
    </main>
    <footer>

    </footer>
</body>
</html>
