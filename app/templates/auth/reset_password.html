{% extends 'auth/base.html' %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block heading %}새 비밀번호 설정{% endblock %}
{% block description %}학교 이메일로 받은 인증번호를 입력해주세요.{% endblock %}
{% block form %}
<form method="post" class="auth-form" id="reset_password_form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
        <label for="email_code">인증번호</label>
        <input id="email_code" name="email_code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="인증번호 6자리" required>
    </div>
    <div class="form-field">
        <label for="password">새 비밀번호</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="6자 이상" required>
    </div>
    <div class="form-field">
        <label for="password_check">새 비밀번호 확인</label>
        <input id="password_check" name="password_check" type="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="한 번 더 입력하세요" required>
    </div>
    <button type="submit" class="primary-button">비밀번호 변경</button>
</form>
{% endblock %}
{% block footer %}<p class="auth-footer"><a href="{{ url_for('auth.forgot_password') }}">인증번호 다시 받기</a> · <a href="{{ url_for('auth.login') }}">로그인</a></p>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>{% endblock %}
