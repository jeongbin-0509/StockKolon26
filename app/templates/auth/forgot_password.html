{% extends 'auth/base.html' %}
{% block title %}비밀번호 찾기{% endblock %}
{% block heading %}비밀번호 찾기{% endblock %}
{% block description %}가입할 때 사용한 학번과 학교 이메일을 입력해주세요.{% endblock %}
{% block form %}
<form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
        <label for="usernum">학번</label>
        <input id="usernum" name="usernum" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="username" placeholder="학번 5자리" required>
    </div>
    <div class="form-field">
        <label for="email">학교 이메일</label>
        <input id="email" name="email" type="email" maxlength="73" autocomplete="email" placeholder="가입한 @goedu.kr 이메일" required>
    </div>
    <button type="submit" class="primary-button">인증번호 받기</button>
</form>
{% endblock %}
{% block footer %}<p class="auth-footer"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></p>{% endblock %}
